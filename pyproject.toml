[project]
name = "tribalscale-summarizer"
version = "0.1.0"
description = "Text to summary + action items with Claude, structured JSON, local checks and an LLM judge"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6,<3",
    "pydantic>=2,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summarizer"]

[tool.pytest.ini_options]
markers = ["live: hits the real Anthropic API"]
addopts = "-m 'not live'"
testpaths = ["tests"]
